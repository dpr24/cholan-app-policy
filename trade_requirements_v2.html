The system anchors pullback logic to a captured NIFTY index CrossPrice and uses the selected option premium only as supporting execution telemetry.
| **03** | **Anchor** | Captures the live **NIFTY index level** as CrossPrice and stores the selected option contract premium as a reference snapshot. |
| **04** | **Tolerance** | Entry remains valid only while the live NIFTY index trades within **CrossPrice +/- 10 index points**. |

### 3.2 CrossPrice Index Tolerance Rule
- CrossPrice validation is based on **NIFTY index points**, not a fixed option-premium rupee band.
- Valid entry zone: **Captured NIFTY CrossPrice - 10 points to Captured NIFTY CrossPrice + 10 points**.
- If NIFTY moves outside this +/- 10 point zone before entry, the setup must pause, revalidate MACD alignment, and wait for a fresh valid anchor.
### 3.3 Persistence Layer
- CrossPrice metadata can be persisted in Redis for restart resilience, including captured index level, option premium snapshot, timestamp, direction, and tolerance status.
### 4.1 Risk-Based Quantity Engine (No Fixed Lot Cap)
- **No hard-coded trade quantity limit** is allowed in the strategy logic.
- The previous fixed **2-lot** style cap is removed from the requirements.
- NIFTY lot sizing must use the exchange lot definition: **1 Lot = 65 Quantity**.
- Final order quantity is calculated dynamically from the customer's dashboard configuration, risk level, available capital, margin requirement, and active exposure.
### 4.2 Customer Dashboard Risk Controls
- Customers must be able to set their own risk profile from the dashboard instead of the system forcing a fixed trade quantity.
- Dashboard controls must include: **risk level**, **capital size**, **maximum capital utilization**, and **per-trade risk percentage/value**.
- The engine should convert the selected risk profile into an eligible lot quantity using the 65-quantity lot multiplier.
- The platform may show risk warnings and projected exposure, but it must not force a universal 2-lot limit for every customer.
### 4.3 Pullback Entry Execution
- **Condition**: MACD alignment remains valid and the live NIFTY index stays inside the **CrossPrice +/- 10 index-point** zone.
- **Action**: Execute the dashboard risk-engine quantity in NIFTY lots, where each lot equals **65 quantity**.
- Scale-in behavior, if enabled, must divide the risk-engine quantity by configured allocation percentages rather than fixed 1-lot steps.
### 4.4 Dead-Zone Invalidation
- If NIFTY index moves outside the **CrossPrice +/- 10 index-point** zone before entry, the trade setup is invalidated until a fresh aligned CrossPrice is captured.
### 4.5 Entry Session Window (Mandatory Intraday Gate)
    Anchor --> Pullback{Inside CrossPrice +/- 10 NIFTY points?}
    Pullback -->|Yes| RiskQty[Calculate dashboard risk quantity]
    RiskQty --> Entry[Execute Entry]
- **Capital Barrier**: Maximum utilization is derived from the customer's dashboard risk level and capital size.
- **Quantity Governance**: No fixed 2-lot cap; position size is calculated from customer-defined risk, available capital, margin requirement, and NIFTY lot size (**65 quantity per lot**).
JAPOON V3 now follows a strict **2-timeframe MACD alignment + CrossPrice +/- 10 NIFTY index-point pullback entry** framework, with customer-controlled dashboard risk sizing, defined intraday entry windows, and mandatory day-end square-off, while keeping existing stop-loss and profit-booking behavior unchanged.

    <script>
        // Configure Mermaid to support dark mode professionally

        // Extract <pre> blocks targeting mermaid
        const renderMermaid = async () => {
            const preTags = document.querySelectorAll('pre code.language-mermaid');
            preTags.forEach((codeBlock) => {
                const pre = codeBlock.parentElement;
                const mermaidDiv = document.createElement('div');
                mermaidDiv.className = 'mermaid';
                mermaidDiv.textContent = codeBlock.textContent;
                pre.replaceWith(mermaidDiv);
            });
            await mermaid.run();
        };

        renderMermaid();
